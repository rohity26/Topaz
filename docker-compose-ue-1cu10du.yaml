volumes:
  gnb-storage: null
  grafana-storage: null
  influxdb-storage: null
  prometheus-storage:
    driver: local
    driver_opts:
      type: none
      device: ./setup/prometheus/
      o: bind
networks:
  oran-intel:
    external: true
  telemetry-net:
    external: true
