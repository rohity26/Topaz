# 1-CU / 10-DU topology -- GENERATED, do not hand-edit.
# Derived from docker-compose-cu++.yaml so the service definitions stay identical to the
# 4-CU stack. Only two things differ: cu1/cu2/cu3 are absent, and each
# component mounts its *_1cu10du config instead of the original.
# Container names are deliberately unchanged (srscu0, srsdu0-9, srsue0-9)
# so every Prometheus query and the 874-column schema keep working.
services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: RAN/srsRAN_Project/docker/open5gs
      target: open5gs
      args:
        OS_VERSION: '22.04'
        OPEN5GS_VERSION: v2.7.0
    env_file:
    - ${OPEN_5GS_ENV_FILE:-RAN/srsRAN_Project/docker/open5gs/open5gs.env}
    privileged: true
    ports:
    - 9999:9999/tcp
    - 38412:38412/sctp
    - 2152:2152/udp
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.20 7777
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      oran-intel:
        ipv4_address: 175.53.1.2
      core-net:
        ipv4_address: 176.53.1.2
  cu0:
    container_name: srscu0
    image: srsran:split_8_zmq
    build:
      context: RAN/srsRAN_Project/
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: '22.04'
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
    - SYS_NICE
    - CAP_SYS_PTRACE
    - NET_ADMIN
    volumes:
    - /dev/bus/usb/:/dev/bus/usb/
    - /usr/share/uhd/images:/usr/share/uhd/images
    - ./RAN/entrypoint_0.sh:/tmp/entrypoint.sh
    - ./RAN/cu_0_1cu10du.yml:/config/cu.conf
    networks:
      oran-intel:
        ipv4_address: 175.53.10.1
      telemetry-net:
        ipv4_address: 171.53.10.1
      core-net:
        ipv4_address: 176.53.10.1
    depends_on:
      5gc:
        condition: service_healthy
    command: bash -c 'chmod +x /tmp/entrypoint.sh && /tmp/entrypoint.sh && srscu -c /config/cu.conf'
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 3G
        reservations:
          cpus: '3.0'
          memory: 3G
volumes:
  gnb-storage: null
  grafana-storage: null
  influxdb-storage: null
  prometheus-storage:
    driver: local
    driver_opts:
      type: none
      device: ./setup/prometheus/
      o: bind
networks:
  oran-intel:
    external: true
  telemetry-net:
    external: true
  core-net:
    external: true
