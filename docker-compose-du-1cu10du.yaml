# 1-CU / 10-DU topology -- GENERATED, do not hand-edit.
# Derived from docker-compose-du.yaml so the service definitions stay identical to the
# 4-CU stack. Only two things differ: cu1/cu2/cu3 are absent, and each
# component mounts its *_1cu10du config instead of the original.
# Container names are deliberately unchanged (srscu0, srsdu0-9, srsue0-9)
# so every Prometheus query and the 874-column schema keep working.
services:
  du0:
    container_name: srsdu0
    image: srsran:split_8_zmq
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
    - SYS_NICE
    - CAP_SYS_PTRACE
    - NET_ADMIN
    volumes:
    - /dev/bus/usb/:/dev/bus/usb/
    - /usr/share/uhd/images:/usr/share/uhd/images
    - ./RAN/du_1cu10du_0.conf:/config/du.conf
    - ./RAN/du_entrypoint.sh:/tmp/entrypoint.sh
    networks:
      oran-intel:
        ipv4_address: 175.53.1.10
      telemetry-net:
        ipv4_address: 171.53.1.10
    command: bash -c 'chmod +x /tmp/entrypoint.sh && /tmp/entrypoint.sh && srsdu -c /config/du.conf'
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 3G
        reservations:
          cpus: '3.0'
          memory: 3G
