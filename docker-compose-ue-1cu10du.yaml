# 1-CU / 10-DU topology -- GENERATED, do not hand-edit.
# Derived from docker-compose-ue++.yaml so the service definitions stay identical to the
# 4-CU stack. Only two things differ: cu1/cu2/cu3 are absent, and each
# component mounts its *_1cu10du config instead of the original.
# Container names are deliberately unchanged (srscu0, srsdu0-9, srsue0-9)
# so every Prometheus query and the 874-column schema keep working.
services:
  ue0:
    container_name: srsue0
    image: srsue:split_8_zmq
    user: root
    build:
      context: UE
      dockerfile: Dockerfile
      args:
        OS_VERSION: '22.04'
    devices:
    - /dev/net/tun
    cap_add:
    - SYS_NICE
    - SYS_RESOURCE
    - NET_ADMIN
    - CAP_IPC_LOCK
    env_file:
    - .env
    volumes:
    - ./UE/ue_1cu10du_0.conf:/configs/ue.conf
    - /dev/null:/tmp/ue.log
    environment:
    - LD_LIBRARY_PATH=/srsue_4G/lib/src/phy/rf/
    - PING=${PING}
    networks:
      oran-intel:
        ipv4_address: 175.53.2.1
    command: bash -c '/srsue_4G/srsue/src/srsue /configs/ue.conf'
